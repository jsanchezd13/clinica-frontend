<div class="container mt-4 form-wrapper">
  <div class="form-card">
    <h3>Registrar enfermedad</h3>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Nombre *</label>
          <input type="text" class="form-control" formControlName="nombre"
                 [class.is-invalid]="f['nombre'].invalid && f['nombre'].touched">
          <div class="invalid-feedback" *ngIf="f['nombre'].invalid && f['nombre'].touched">
            El nombre es obligatorio (2-100 caracteres).
          </div>
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Categoría</label>
          <input type="text" class="form-control" formControlName="categoria" maxlength="50">
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Código CIE</label>
          <input type="text" class="form-control" formControlName="codigoCie" maxlength="20">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" formControlName="descripcion" rows="2" maxlength="500"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Síntomas</label>
        <textarea class="form-control" formControlName="sintomas" rows="2" maxlength="500"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Tratamiento</label>
        <textarea class="form-control" formControlName="tratamiento" rows="2" maxlength="500"></textarea>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Nivel de gravedad (1-5)</label>
          <input type="number" class="form-control" formControlName="nivelGravedad" min="1" max="5"
                 [class.is-invalid]="f['nivelGravedad'].invalid && f['nivelGravedad'].touched">
          <div class="invalid-feedback" *ngIf="f['nivelGravedad'].invalid && f['nivelGravedad'].touched">
            Debe estar entre 1 y 5.
          </div>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Tiempo de recuperación (días)</label>
          <input type="number" class="form-control" formControlName="tiempoRecuperacionDias" min="1">
        </div>

        <div class="col-md-4 mb-3 d-flex flex-column justify-content-center">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" formControlName="esCronica" id="esCronica">
            <label class="form-check-label" for="esCronica">Es crónica</label>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" formControlName="esContagiosa" id="esContagiosa">
            <label class="form-check-label" for="esContagiosa">Es contagiosa</label>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : 'Guardar enfermedad' }}
        </button>
        <button type="button" class="btn-cancel" (click)="cancelar()">
          Cancelar
        </button>
      </div>

    </form>
  </div>
</div>
