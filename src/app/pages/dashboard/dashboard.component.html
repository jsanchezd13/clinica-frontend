<!-- pages/dashboard/dashboard.component.html -->
<div class="dashboard-wrapper">

  <div class="welcome-header">
    <h1>Bienvenido, {{ usuario?.username }}</h1>
    <p class="subtitle">
      <span class="role-badge">{{ roles.join(', ') }}</span>
    </p>
  </div>

  <!-- Panel para ADMIN -->
  <div *ngIf="isAdmin" class="stat-grid">
    <div class="stat-card">
      <div class="stat-icon">
        <i class="bi bi-people-fill"></i>
      </div>
      <div class="stat-body">
        <h5>Total pacientes</h5>
        <p class="stat-value" [class.placeholder]="totalPacientes === null">
          {{ totalPacientes ?? 'Cargando…' }}
        </p>
      </div>
    </div>
  </div>

  <!-- Panel para RECEPCION -->
  <div *ngIf="isRecepcion" class="info-panel">
    <h5><i class="bi bi-calendar-check"></i> Panel de Recepción</h5>
    <p>Consulta la agenda y gestiona el ingreso de pacientes desde el menú lateral.</p>
  </div>

</div>
